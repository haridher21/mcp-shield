[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpshield"
version = "0.1.0"
description = "Security gateway that pins, diffs and enforces MCP tool definitions and validates tool I/O."
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "jsonschema>=4.20", "anyio>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcpshield = "mcpshield.cli:main"

[tool.setuptools]
packages = ["mcpshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "demo"]
